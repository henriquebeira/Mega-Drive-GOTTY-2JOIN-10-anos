name: Compilar ROM Mega Drive

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Converter imagens para formato do Mega Drive
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          for img in res/*.png; do
            convert "$img" -background magenta -alpha remove -alpha off -colors 16 -type Palette PNG8:"$img"
          done

      - name: Compilar com SGDK
        run: |
          chmod -R 777 "$PWD"
          P1="registry"
          P2="gitlab"
          P3="com"
          P4="doragasu"
          P5="docker-sgdk:v2.00"
          IMG="${P1}.${P2}.${P3}/${P4}/${P5}"
          docker run --rm -v "$PWD":/m68k "$IMG"

      - name: Renomear ROM
        run: sudo mv out/rom.bin "out/GOTTY 2JOIN 10 anos.bin"

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: GOTTY 2JOIN 10 anos
          path: out/GOTTY 2JOIN 10 anos.bin
