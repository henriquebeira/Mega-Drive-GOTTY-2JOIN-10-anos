name: Compilar ROM Mega Drive

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Compilar com SGDK
        run: |
          P1="registry"
          P2="gitlab"
          P3="com"
          P4="doragasu"
          P5="docker-sgdk:latest"
          IMG="${P1}.${P2}.${P3}/${P4}/${P5}"
          docker run --rm -v "$PWD":/m68k "$IMG"

      - name: Disponibilizar ROM para download
        uses: actions/upload-artifact@v4
        with:
          name: megadrive-rom
          path: out/rom.bin
